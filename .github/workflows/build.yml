name: β版ビルド・自動更新配布

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 型チェック・アプリビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund --no-package-lock
      - name: 型チェック
        run: npm run typecheck
      - name: アプリをビルド
        run: npm run build
      - name: Electron file URL向けの相対アセットパスを検証
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          const assets = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map(match => match[1])
            .filter(path => path.includes(".js") || path.includes(".css"));
          console.log("生成されたアセットURL:", assets);
          if (assets.length < 2) {
            throw new Error("JS/CSSアセットURLを dist/index.html から検出できません。");
          }
          const invalid = assets.filter(path => !path.startsWith("./"));
          if (invalid.length) {
            throw new Error("Electron file://で読み込めないアセットURLがあります: " + invalid.join(", "));
          }
          console.log("Electron向け相対アセットパス OK");
          NODE

  windows-installer:
    name: Windows β版インストーラーを作成
    runs-on: windows-latest
    needs: quality
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund --no-package-lock
      - name: yt-dlp Windows版を取得してアプリへ同梱
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "vendor/win-x64" | Out-Null
          $target = "vendor/win-x64/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile $target
          if ((Get-Item $target).Length -lt 10000000) {
            throw "yt-dlp.exe のダウンロードサイズが不正です。"
          }
          & $target --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp.exe を実行できませんでした。" }
      - name: Windowsインストーラーを作成
        run: npm run dist:win
      - name: インストーラーを保存
        uses: actions/upload-artifact@v4
        with:
          name: Kick-Recorder-beta-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: GitHub Releasesへ自動更新版を公開
    runs-on: windows-latest
    concurrency:
      group: kick-recorder-release-${{ github.ref }}
      cancel-in-progress: false
    needs: quality
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: バージョンとタグの一致を確認
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $refName = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF.StartsWith("refs/heads/release/")) {
            $refName = $refName.Substring("release/".Length)
          }
          if ($refName -ne "v$version") {
            throw "リリース参照 $refName と package.json のバージョン v$version が一致しません。"
          }
      - name: GitHub Releases用のバージョンタグを確認
        id: release_tag
        if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existingRemote = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHubのタグ情報を確認できませんでした。"
          }
          if ($existingRemote) {
            git fetch --tags origin
            if ($LASTEXITCODE -ne 0) { throw "既存タグを取得できませんでした。" }
            $tagCommit = git rev-list -n 1 $tag
            if (-not $tagCommit) { throw "既存タグ $tag を読み取れませんでした。" }
            "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "既存タグ $tag のReleaseアセットを更新します。"
          } else {
            git tag $tag
            if ($LASTEXITCODE -ne 0) { throw "タグを作成できませんでした。" }
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "GitHubへタグをpushできませんでした。" }
            "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: 同一タグの重複Releaseを整理
        if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/kanenao/Kick-Live-Message-Recorder/releases?per_page=100"
          $releases = Invoke-RestMethod -Headers $headers -Uri $uri
          $matches = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($matches.Count -gt 1) {
            $installerName = "Kick-Recorder-Setup-$version.exe"
            $keep = $matches | Where-Object {
              ($_.assets.name -contains $installerName) -and ($_.assets.name -contains "latest.yml")
            } | Select-Object -First 1
            if (-not $keep) {
              throw "タグ $tag のReleaseが重複していますが、インストーラーとlatest.ymlを持つReleaseを特定できません。"
            }
            foreach ($release in $matches) {
              if ($release.id -ne $keep.id) {
                Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/kanenao/Kick-Live-Message-Recorder/releases/$($release.id)"
                Write-Host "重複Release $($release.id) を削除しました。"
              }
            }
          } else {
            Write-Host "同一タグの重複Releaseはありません。"
          }
      - name: GitHub Releaseを1件だけ先に作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $repo = "kanenao/Kick-Live-Message-Recorder"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title $version --notes "Kick Recorder $version" --prerelease
            if ($LASTEXITCODE -ne 0) { throw "GitHub Releaseを作成できませんでした。" }
          } else {
            Write-Host "GitHub Release $tag はすでに存在します。"
          }
      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund --no-package-lock
      - name: β版インストーラーと更新情報をGitHub Releasesへ公開
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.release_tag.outputs.should_publish == 'true' }}
        run: npm run publish:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
