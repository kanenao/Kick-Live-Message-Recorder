name: Beta build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Type check and renderer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Type check
        run: npm run typecheck
      - name: Build application
        run: npm run build

  windows-installer:
    name: Build Windows beta installer
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build NSIS installer
        run: npm run dist:win
      - name: Upload beta installer
        uses: actions/upload-artifact@v4
        with:
          name: Kick-Recorder-beta-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
