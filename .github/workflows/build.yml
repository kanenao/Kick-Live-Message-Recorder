name: β版ビルド・自動更新配布

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 型チェック・アプリビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund --no-package-lock
      - name: 型チェック
        run: npm run typecheck
      - name: アプリをビルド
        run: npm run build

  windows-installer:
    name: Windows β版インストーラーを作成
    runs-on: windows-latest
    needs: quality
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Windowsインストーラーを作成
        run: npm run dist:win
      - name: インストーラーを保存
        uses: actions/upload-artifact@v4
        with:
          name: Kick-Recorder-beta-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: GitHub Releasesへ自動更新版を公開
    runs-on: windows-latest
    needs: quality
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: バージョンとタグの一致を確認
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $refName = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF.StartsWith("refs/heads/release/")) {
            $refName = $refName.Substring("release/".Length)
          }
          if ($refName -ne "v$version") {
            throw "リリース参照 $refName と package.json のバージョン v$version が一致しません。"
          }
      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund --no-package-lock
      - name: β版インストーラーと更新情報をGitHub Releasesへ公開
        run: npm run publish:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
