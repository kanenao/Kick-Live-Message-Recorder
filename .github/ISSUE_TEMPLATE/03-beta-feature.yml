name: "機能要望｜β版"
description: "β版への新機能・改善を提案"
title: "[β版][機能要望] "
body:
  - type: markdown
    attributes:
      value: "対象：**β版** ／ 種類：**機能要望**。投稿後、タグとAI判定待ちが付き、AIが整理します。投稿内容を自動で実行することはありません。パスワード・APIキー・セッションID・個人情報は書かないでください。"
  - type: input
    id: app_version
    attributes:
      label: アプリのバージョン
      description: "例：1.0.1-beta.95（バージョン更新画面で確認）"
      placeholder: バージョン番号を入力してください
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: "実現したい機能・改善内容"
      description: "欲しい機能、利用場面、現在困っている点を教えてください。"
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: "その機能で解決したいこと"
      placeholder: "この機能があると〜ができる"
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: "参考例・補足"
      description: 秘密情報・本名・認証Cookieやトークンは貼らないでください。ログや画像は必ず伏せ字にしてください。
    validations:
      required: false
